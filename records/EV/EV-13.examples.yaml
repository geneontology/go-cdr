- id: EV-13-E2
  title: A molecular-function ND beside an experimental tether activity
  verdict: NON_CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P18409
      symbol: MDM10
    taxon: NCBITaxon:559292
    term:
      term_id: GO:0003674
      label: molecular_function
    qualifier: enables
    evidence_code: ND
    reference: GO_REF:0000015
  explanation: |
    The record's own example of a stale ND. Kornmann et al. 2009 showed that the Mmm1/Mdm10/Mdm12/Mdm34
    complex connects the ER and mitochondria, which can be bypassed by a synthetic tether, so literature on
    this gene product now identifies a molecular function. The review removed the ND with `nd_case: STALE`
    and quoted the paper.
  fix: |
    Remove the ND; the molecular function is carried by the experimental tether annotation.
