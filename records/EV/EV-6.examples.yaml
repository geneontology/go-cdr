- id: EV-6-E2
  title: Heart development from a postnatal rise in creatine kinase expression
  verdict: NON_CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P09605
      symbol: Ckmt2
    taxon: NCBITaxon:10116
    term:
      term_id: GO:0007507
      label: heart development
    qualifier: involved_in
    evidence_code: IEP
    reference: PMID:8086475
  explanation: |
    The record's own "do not annotate" case: a developmental time-course read as a tissue-building role.
    The review found that sMtCK mRNA is undetectable in prenatal heart and rises after birth, which
    reflects the maturing heart's demand for phosphocreatine buffering, not an instructive role in heart
    morphogenesis, and marked the row over-annotated.
  fix: |
    No heart development row; the expression pattern is kept as an observation, not a process.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/rat/Ckmt2/Ckmt2-ai-review.yaml#L301
