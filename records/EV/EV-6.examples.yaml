  title: A heat-shock chaperone annotated to response to heat by IEP
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P06582
      symbol: hsp-16.2
    taxon: NCBITaxon:6239
    term:
      term_id: GO:0009408
      label: response to heat
    qualifier: involved_in
    evidence_code: IEP
