- id: BP-3-E1
  title: The renin-angiotensin GO-CAM represents angiotensinogen without placing it in angiotensin maturation
  verdict: CONFORMANT
  subject:
    subject_kind: gocam
    model: gomodel:6246724f00000549
    description: |
      Renin-angiotensin pathway (Human). AGT (UniProtKB:P01019) appears as the enabler of the
      GO:0005179 hormone activity node and, separately, as `has_input` (RO:0002233) molecules of the renin
      (GO:0004190) and ACE (GO:0008241) activities, which are the ones placed in GO:0002003 angiotensin
      maturation.
  explanation: |
    This is the record's worked example, checked against the cached model. The curator included AGT,
    gave it the hormone-activity role and the proteases' input role, and put only the protease activities
    in GO:0002003. Under the record, that is a decision to argue with explicitly, not a gap. The AGT review
    did not propose GO:0002003 for AGT. It raised the representation of substrates as a suggested question
    to the GO editors instead.
  see_also:
  - BP-2
  derived_from:
