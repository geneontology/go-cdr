      gene_id: UniProtKB:P09605
      symbol: Ckmt2
    taxon: NCBITaxon:10116
    term:
      term_id: GO:0007507
      label: heart development
    qualifier: involved_in
    evidence_code: IEP
    reference: PMID:8086475
  explanation: |
    This is the record's IEP worked example. Sarcomeric mitochondrial creatine kinase mRNA is undetectable
    in prenatal heart and rises postnatally; the review read that as the maturing heart's growing need for
    phosphocreatine buffering, not as a step in building the heart. An expression time-course does not
    show the gene performs a developmental step, so GO:0007507 heart development is not supported.
  fix: |
    `MARK_AS_OVER_ANNOTATED`, as the review did. Do not make new development annotations from expression
    time-courses of metabolic enzymes.
