- id: BP-14-E1
  title: Drinking behavior transferred to the AT1A receptor although the paralog AT1B carries it
  verdict: NON_CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P29754
      symbol: Agtr1a
    taxon: NCBITaxon:10090
    term:
      term_id: GO:0042756
      label: drinking behavior
    qualifier: involved_in
    evidence_code: IEA
    reference: GO_REF:0000120
  explanation: |
    This is the record's contradicted-claim example. The review found that direct central angiotensin II
    experiments separate AT1A-dependent blood-pressure responses from drinking behavior, which requires
    AT1B. That is a paralog assignment contradicting the claim, which is the record's ground for `REMOVE`.
    The review left the gene's three experimental rows for the same term `UNDECIDED` because their papers
    are abstract-only in the cache, which matches the record's last row for inaccessible evidence.
  fix: |
    REMOVE this IEA row (and the ISO row from the same projection).
