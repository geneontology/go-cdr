- id: CC-5-E2
  title: An is_active_in row for heat-stress sequestration in a nucleolar inclusion
  verdict: NON_CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:O59790
      symbol: ark1
    taxon: NCBITaxon:284812
    term:
      term_id: GO:0140602
      label: nucleolar peripheral inclusion body
    qualifier: is_active_in
    evidence_code: IDA
    reference: PMID:33176152
  explanation: |
    The record reserves `is_active_in` for the compartment where the protein works and puts sequestration
    under `located_in`. The review kept this IDA row as non-core but noted that "is_active_in" is generous,
    because the observation is acute heat-stress aggregation of the Aurora kinase at the nucleolar
    periphery, which "represents sequestration rather than function". The location is real; the relation
    is not.
  fix: |
    `located_in` nucleolar peripheral inclusion body, kept non-core; the kinase's working compartments
    carry the `is_active_in` claim.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/SCHPO/ark1/ark1-ai-review.yaml#L551
