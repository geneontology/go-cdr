  explanation: |
    The record's own example: DAF-16 is held in the cytoplasm until insulin signalling is relieved and
    acts as a transcription factor in the nucleus. This IDA row records the cytoplasmic pool with
    `located_in`, which is the relation the record asks for on a sequestering compartment, and the review
    accepts it beside the gene's direct-evidence nucleus rows.
