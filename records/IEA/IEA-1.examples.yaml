record: IEA-1
examples:
- id: IEA-1-E1
  title: A combined-pipeline enzyme row judged by the reactions in its WITH/FROM
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:G5AY81
      symbol: Has2
    taxon: NCBITaxon:10181
    term:
      term_id: GO:0050501
      label: hyaluronan synthase activity
    qualifier: enables
    evidence_code: IEA
    reference: GO_REF:0000120
  explanation: |
    The row is `GO_REF:0000120`, so several pipelines produced the term, and its WITH/FROM names
    ARBA00098315, RHEA:12528, EC:2.4.1.212 and PANTHER:PTN000530842. The review judged the claim
    through those premises: it accepted the row because the Rhea reaction and EC number match the two
    catalytic-activity reactions curated in the UniProt entry, so the enzymatic identity does not rest
    on family membership alone. That is the reading the record asks for: the premise in WITH/FROM, not
    the evidence code, is what gets checked.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/HETGA/Has2/Has2-ai-review.yaml#L515
- id: IEA-1-E2
  title: Kinase ATP binding read from the site entry in WITH/FROM, not the domain entry
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:Q39026
      symbol: MPK6
    taxon: NCBITaxon:3702
    term:
      term_id: GO:0005524
      label: ATP binding
    qualifier: enables
    evidence_code: IEA
    reference: GO_REF:0000002
  explanation: |
    The InterPro2GO row for Arabidopsis MPK6 lists `IPR000719`, `IPR003527` and `IPR017441` in
    WITH/FROM. The review read it as the ATP-binding-site claim (`IPR017441`, with the UniProt binding
    positions and the catalytic K92), which is the reading the record's Application gives for an active
    kinase, and accepted it. Had the only premise been the protein kinase domain entry, the same term
    would have been a claim about every kinase-domain protein, pseudokinases included (see IEA-2).
  see_also:
  - IEA-2
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/ARATH/MPK6/MPK6-ai-review.yaml#L103
