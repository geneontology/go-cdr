- id: IEA-6-E1
  title: A retired-keyword row reviewed for the record and recognised as historical
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:Q9AWL7
      symbol: GI
    taxon: NCBITaxon:39947
    term:
      term_id: GO:0009908
      label: flower development
    evidence_code: IEA
    reference: GO_REF:0000043
  explanation: |
    The row is a KW2GO annotation (`GO_REF:0000043`) from the UniProt "Flowering" keyword. The review
    noted that it is snapshot-only and already removed in the current GOA release, and still judged the
    biology: OsGI regulates flowering time rather than building the flower, so it recorded a MODIFY to
    the regulation term. That is the treatment the record gives a retired pipeline's row: reviewed for
    the record, not relied on, not expected in the next release.
