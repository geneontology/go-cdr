- id: PH-19-E1
  title: SSB1's refolding IBA generalized to protein folding under the fungal IRD
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P11484
      symbol: SSB1
    taxon: NCBITaxon:559292
    term:
      term_id: GO:0042026
      label: protein refolding
    qualifier: involved_in
    evidence_code: IBA
    reference: GO_REF:0000033
  explanation: |
    The review found that current PAINT places an IRD for `GO:0042026` at the fungal node PTN001065099 and
    carries the broader `GO:0006457` protein folding through that branch, and followed the node: it
    MODIFYed the row to protein folding rather than keeping a term a phylogenetic curator had withdrawn.
    The record asks reviewers to check for such a loss before keeping or adding the term.
  see_also:
