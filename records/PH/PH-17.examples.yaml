  title: Angiogenesis transferred to a non-angiogenic rodent angiogenin paralog
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:Q64438
      symbol: Ang2
    taxon: NCBITaxon:10090
    term:
      term_id: GO:0001525
      label: angiogenesis
    qualifier: involved_in
    evidence_code: ISO
    reference: GO_REF:0000119
  explanation: |
    The review removed the ISO row because PMID:8633065 shows that mouse Ang2 (Angrp) is non-angiogenic.
    The record treats physiological and tissue processes as unsafe to transfer without target evidence,
    and flags a donor that is not the target's namesake; Ang2 is a divergent member of an expanded rodent
    family, and this is the record's worked example.
