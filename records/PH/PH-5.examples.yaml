- id: PH-5-E2
  title: A protein homodimerization activity IBA accepted as TRIM5's core molecular function
  verdict: NON_CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:Q9C035
      symbol: TRIM5
    taxon: NCBITaxon:9606
    term:
      term_id: GO:0042803
      label: protein homodimerization activity
    qualifier: enables
    evidence_code: IBA
    reference: GO_REF:0000033
  explanation: |
    The review accepted this IBA as a "core molecular function" because coiled-coil dimerization and
    B-box multimerization are essential for capsid-lattice recognition. The self-association is real,
    but the record names `GO:0042803` protein homodimerization activity among the uninformative binding
    children that should never be placed on an IBD. Accepting the propagated row as core endorses a
    placement the record rules out and lets a structural property stand in for TRIM5's activity.
  fix: |
    Do not take the IBA row as a core function: mark it over-annotated with the node noted for PAINT,
    describe the self-association in the core function's description, and anchor the core function on
    an informative activity term supported by TRIM5's own evidence.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/human/TRIM5/TRIM5-ai-review.yaml#L153
