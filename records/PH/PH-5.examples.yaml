- id: PH-5-E1
  title: A response to iron ion IBA on a maize iron-chelate transporter, seeded by expression rows
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:A0A1D6HET4
      symbol: LOC541800
    taxon: NCBITaxon:4577
    term:
      term_id: GO:0010039
      label: response to iron ion
    qualifier: involved_in
    evidence_code: IBA
    reference: GO_REF:0000033
  explanation: |
    The review found that the descendant evidence behind the PAINT node is expression evidence (the
    Arabidopsis YSL1 and YSL2 rows are IEP), and that a transporter whose transcript responds to iron
    status "performs no step of sensing or responding to iron ions". It marked the row over-annotated
    and kept the transport function as core. The record lists "response to" terms among those that
    should not be placed on an IBD at all.
