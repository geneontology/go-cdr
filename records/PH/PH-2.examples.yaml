  explanation: |
    The review traced the IBA at PTN001247822 to its sole seed, the PseudoCAP IMP row on *P. aeruginosa*
    ccmC, and found that it "turns the loss of catalase activity in a ccmC mutant into a molecular
    function of CcmC"; the loss is explained by poor heme supply to the heme catalases. CcmC has no
    catalase domain. The record says an IMP phenotype grounds "needed for" a process, not an MF, and uses
    this node as its worked example; the review removes the catalase IBA while keeping the node's sound
    plasma membrane and cytochrome c biosynthesis IBDs.
