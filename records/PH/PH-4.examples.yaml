record: PH-4
examples:
- id: PH-4-E1
  title: A JAK-STAT pathway term inherited by a Dictyostelium STAT, moved to the STAT-only term
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:O00910
      symbol: statA
    taxon: NCBITaxon:44689
    term:
      term_id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    qualifier: involved_in
    evidence_code: IBA
    reference: GO_REF:0000033
  explanation: |
    The review found that the JAK-STAT term "is incorrect for this organism because no JAK exists in
    Dictyostelium", and that the canonical JAK-STAT pathway was assembled only in the bilaterian lineage.
    This is the record's prerequisite test: the IBD for `GO:0007259` sits on a node older than the JAK
    family it presupposes, so an amoebozoan STAT inherits a pathway its lineage lacks. The review replaced
    the row with `GO:0097696` cell surface receptor signaling pathway via STAT, which presupposes no JAK.
  see_also:
  - ONT-18
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/DICDI/statA/statA-ai-review.yaml#L92
