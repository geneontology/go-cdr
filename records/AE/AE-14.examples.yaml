- id: AE-14-E1
  title: A protease row accepted with its substrate, process and location extensions checked
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P36776
      symbol: LONP1
    taxon: NCBITaxon:9606
    term:
      term_id: GO:0004176
      label: ATP-dependent peptidase activity
    qualifier: enables
    evidence_code: IDA
    reference: PMID:37327776
    extension: RO:0002233(UniProtKB:Q14154),BFO:0000050(GO:0030163),BFO:0000066(GO:0005739)
  explanation: |
    The record's first case: the extension is true and informative, so ACCEPT the row and record the
    extension. The review checked each atom against PMID:37327776 (LONP1 degrades imported DELE1 in the
    mitochondrial matrix) and found that the extensions "accurately identify DELE1 as input and locate the
    activity within mitochondrial protein catabolism in mitochondria".
  see_also: [AE-3]
