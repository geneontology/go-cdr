record: TR-9
examples:
- id: TR-9-E1
  title: Positive regulation from a reporter carrying the target gene's regulatory sites
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:O00358
      symbol: FOXE1
    taxon: NCBITaxon:9606
    term:
      term_id: GO:0045893
      label: positive regulation of DNA-templated transcription
    qualifier: involved_in
    evidence_code: IDA
    reference: PMID:9697705
  explanation: |
    The paper shows the direction at an identified target: wild-type FOXE1 activates a reporter with TPO
    regulatory sites and the A65V variant does not. The review used the positive term and kept it "promoter- and
    construct-specific", noting that it does not negate separate repression experiments, which matches the record's
    allowance for both directions in different contexts.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/human/FOXE1/FOXE1-ai-review.yaml#L1034
- id: TR-9-E2
  title: An electronic activator-only row on a MADS factor that both activates and represses
  verdict: NON_CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P48007
      symbol: PI
    taxon: NCBITaxon:3702
    term:
      term_id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    qualifier: involved_in
    evidence_code: IEA
    reference: GO_REF:0000002
  explanation: |
    The row assigns a direction from domain signatures. The record applies the unqualified term to propagated
    rows, where direction varies by target. The review marked it over-annotated because PI "acts as both an activator and a
    repressor of RNA Pol II targets".
  fix: |
    Leave the electronic row undirected: GO:0006357 regulation of transcription by RNA polymerase II, which the
    review accepts on an IBA row, already says this; directional terms belong on experimental rows with a named target.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/ARATH/PI/PI-ai-review.yaml#L150
