  title: A plant MADS-box factor on the unqualified dbTF term
  verdict: NON_CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P17839
      symbol: AG
    taxon: NCBITaxon:3702
    term:
      term_id: GO:0003700
      label: DNA-binding transcription factor activity
    qualifier: enables
    evidence_code: IEA
    reference: GO_REF:0000002
  explanation: |
    AGAMOUS regulates nuclear protein-coding developmental genes, which Pol II transcribes. The record says
    eukaryotic regulators take the Pol II-specific terms without the paper naming the polymerase. The review modified the
    IEA row because GO:0000981 "better captures the same core molecular function with the appropriate Pol II
    specificity".
