- id: TR-3-E2
  title: A dbTF row from ChIP occupancy and a requirement for induced transcription
  verdict: NON_CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:Q5TGY3
      symbol: AHDC1
    taxon: NCBITaxon:9606
    term:
      term_id: GO:0003700
      label: DNA-binding transcription factor activity
    qualifier: enables
    evidence_code: IDA
    reference: PMID:35585237
  explanation: |
    ChIP shows where a protein is, not that it binds DNA. The review read the full study and found tagged AHDC1
    occupancy at regulatory chromatin, proximity to transcription complexes and a requirement for GATA3-induced
    transcription, but "the examined ChIP and perturbation assays do not isolate" sequence-selective binding by AHDC1
    itself.
  fix: |
    GO:0003712 transcription coregulator activity, the review's replacement; a chromatin CC row can carry the ChIP
    result.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/human/AHDC1/AHDC1-ai-review.yaml#L248
