- id: MF-7-E2
  title: FK506 binding accepted as a characteristic FKBP function
  verdict: CONTESTED
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:Q02790
      symbol: FKBP4
    taxon: NCBITaxon:9606
    term:
      term_id: GO:0005528
      label: FK506 binding
    qualifier: enables
    evidence_code: TAS
    reference: PMID:1376003
  explanation: |
    The review accepted FK506 binding because the drug binds FKBP4 and inhibits its
    peptidyl-prolyl isomerase activity, calling it "a characteristic molecular function". FK506 is an
    exogenous compound, and the record's open question asks whether drug-named terms like this one
    should fall under the 2020 drug-binding rules, which would make this a proxy or gain-of-function
    binding rather than a function of the protein.
  open_question: 1
