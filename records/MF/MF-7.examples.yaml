- id: MF-7-E1
  title: Binding of a synthetic allosteric compound replaced by cAMP binding
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P12368
      symbol: Prkar2a
    taxon: NCBITaxon:10116
    term:
      term_id: GO:0036094
      label: small molecule binding
    qualifier: enables
    evidence_code: IDA
    reference: PMID:21177871
  explanation: |
    The paper shows the PKA RIIalpha subunit binding a synthetic compound at an allosteric site. The
    review called that a pharmacological property and refined the row to cAMP binding, the
    physiological ligand whose binding the same paper measured by SPR. That is the record's rule:
    annotate the natural ligand, not the probe. The review also flags that the SPR used the human
    protein, so attribution to rat should be checked.
  derived_from:
