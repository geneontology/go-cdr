record: MF-10
examples:
- id: MF-10-E1
  title: A benzil-reduction assay moved to carbonyl reductase, not back to a benzil term
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P40580
      symbol: IRC24
    taxon: NCBITaxon:559292
    term:
      term_id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
    qualifier: enables
    evidence_code: IDA
    reference: PMID:37602278
  explanation: |
    The assay measured NADPH-dependent reduction of benzil, the chromogenic substrate behind the
    obsoleted benzil reductase term, and the row had been moved up to the EC 1.1.1.- grouping class.
    The review kept the assay, did not ask for a benzil-specific term, and refined the row to carbonyl
    reductase (NADPH) activity, the general reaction class the assay does establish. The physiological
    substrate is unknown, so this is the record's fallback: annotate the more general activity the
    assay supports. GO itself stopped at the grouping class ([go-annotation#5840](https://github.com/geneontology/go-annotation/issues/5840)),
    so the refinement goes one step further than the consortium's own fix.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/yeast/IRC24/IRC24-ai-review.yaml#L94
- id: MF-10-E2
  title: A herbicide-degrading enzyme keeps its specific term
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P72156
      symbol: atzA
    taxon: NCBITaxon:47660
    term:
      term_id: GO:0018788
      label: atrazine chlorohydrolase activity
    qualifier: enables
    evidence_code: EXP
    reference: PMID:22768133
  explanation: |
    Atrazine is a synthetic herbicide introduced in the 1950s, but the review accepted the specific
    term: the paper measured kcat/Km for atrazine, and the activity is the selected function of an
    enzyme in a host that grows on atrazine. The record uses this case to show that a man-made
    substrate is not by itself an assay artefact; pathway membership and host biology decide.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/PSESD/atzA/atzA-ai-review.yaml#L95
- id: MF-10-E3
  title: An IEA generated by the Rhea residue of the benzil reductase obsoletion
  verdict: CONTESTED
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:O32099
      symbol: yueD
    taxon: NCBITaxon:224308
    term:
      term_id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
    qualifier: enables
    evidence_code: IEA
    reference: GO_REF:0000120
  explanation: |
    The review traced this row to the RHEA:25968 narrow match left on the grouping class `GO:0016616`
    when `GO:0102306` was obsoleted, the residue the record describes. It refined the row to carbonyl
    reductase (NADPH) activity and asked for the xref to be moved upstream, so that RHEA:25968 maps to
    `GO:0004090` as its sister reaction already does. Who should make that change, GO or the rhea2go
    pipeline, is the record's open question.
  open_question: 1
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/BACSU/yueD/yueD-ai-review.yaml#L116
