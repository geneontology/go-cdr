examples:
- id: MF-3-E1
  title: A GRB2 protein binding row refined to receptor tyrosine kinase adaptor activity
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P62993
      symbol: GRB2
    taxon: NCBITaxon:9606
    term:
      term_id: GO:0005515
      label: protein binding
    qualifier: enables
    evidence_code: IPI
    reference: PMID:19172738
  explanation: 'The record''s GRB2 worked example, row by row. The review read the paper as showing GRB2
    linking

    GAB2 to an activated receptor tyrosine kinase or its docking protein, so the binding achieves

    bridging, and it replaced bare protein binding with transmembrane receptor protein tyrosine kinase

    adaptor activity. Across the gene, most of GRB2''s other protein binding rows were removed or

    refined only to phosphotyrosine or proline-rich region binding where no bridging was shown.

    '
  see_also:
  - MF-5
  - MF-8
