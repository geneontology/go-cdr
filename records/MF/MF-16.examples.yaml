  explanation: |
    The review treated Toll binding as the binding step of a ligand activity and, because the same
    assay showed reporter activation through full-length Toll-1 and Toll-7, refined the row to
    receptor ligand activity. The record gives a protein ligand `GO:0048018` (which has part receptor
    binding) instead of a receptor-specific binding term. The refinement rests on this row's own
    assay, as [MF-2](MF-2.md) requires.
