- id: ONT-13-E2
  title: TMF1's core function moved to the newly minted vesicle membrane tethering activity
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P82094
      symbol: TMF1
    taxon: NCBITaxon:9606
    term:
      term_id: GO:7770062
      label: vesicle membrane tethering activity
    evidence_code: NAS
  explanation: |
    When GO minted `GO:7770062`, the TMF1 review added it as the core MF, "the MF formerly requested here
    as a proposed new term", replacing the stand-in `GO:0060090` molecular adaptor activity, and dropped
    the proposal. That is the record's second example: swap the id in once the term exists. The NEW row
    still lacks an explicit relation, which QN-1 requires.
  see_also:
  - QN-1
  derived_from:
