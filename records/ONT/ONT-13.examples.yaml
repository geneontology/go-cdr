- id: ONT-13-E1
  title: A zebrafish alpha-crystallin holdase row moved to an NTR placeholder
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:Q9PUR2
      symbol: cryaba
    taxon: NCBITaxon:7955
    term:
      term_id: GO:0140309
      label: unfolded protein holdase activity
    qualifier: enables
    evidence_code: IDA
    reference: PMID:15692462
  explanation: |
    The review kept the measured aggregation-suppression activity but did not leave it on the
    carrier-specific `GO:0140309`. It recorded MODIFY with `{id: NTR, label: holdase chaperone activity}`,
    and the core function sets `proposed_molecular_function: holdase chaperone activity` to match a
    proposal. This is the record's pattern for small heat shock proteins, pending a GO term.
  see_also:
