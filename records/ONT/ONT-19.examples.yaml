record: ONT-19
examples:
- id: ONT-19-E1
  title: A sevenless binding IEA on a vertebrate GPRC5 receptor removed for a mapping reason
  verdict: CONTESTED
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:Q8K3J9
      symbol: Gprc5c
    taxon: NCBITaxon:10090
    term:
      term_id: GO:0005118
      label: sevenless binding
    qualifier: enables
    evidence_code: IEA
    reference: GO_REF:0000002
  explanation: |
    The record's worked example pairs an `only_in` Arthropoda constraint on `GO:0005118` sevenless binding
    with a curated rule narrowing the InterPro2GO mapping, the vertebrate GPRC5 rows being the payoff. The
    Gprc5c review removes the row but says "Vertebrates do have the Sevenless ortholog ROS1, so taxon alone
    is not the objection": the false positive is a PRINTS transmembrane hit, and the mammalian ROS1 ligand
    is NELL2. By the record's own test (evidence that the presupposed component is absent from the
    lineage), that weakens the Arthropoda constraint; the PR that filed it offered Metazoa as the
    conservative alternative for exactly this reason.
  discussion: https://github.com/ai4curation/ai-gene-review/pull/6202
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/mouse/Gprc5c/Gprc5c-ai-review.yaml#L58
- id: ONT-19-E2
  title: BOSS keeps sevenless binding under the narrowed curated rule
  verdict: CONFORMANT
  subject:
    subject_kind: annotation
    gene:
      gene_id: UniProtKB:P22815
      symbol: boss
    taxon: NCBITaxon:7227
    term:
      term_id: GO:0005118
      label: sevenless binding
    qualifier: enables
    evidence_code: IEA
    reference: GO_REF:0000002
  explanation: |
    The review accepted the InterPro2GO row for *Drosophila* BOSS, the Sevenless ligand, and noted that the
    mapping is over-broad for other members of the signature and that curated rule CR-0006 (requiring
    IPR050726 and Diptera) keeps the annotation on BOSS while dropping them. The record asks a
    constraint proposal to list the annotations it would block and any it would block wrongly; BOSS is the
    row that must survive, and it does.
  derived_from:
  - https://github.com/ai4curation/ai-gene-review/blob/a0fef8e0aa0b75e1842f20a7795c1d413e0ff1ba/genes/DROME/boss/boss-ai-review.yaml#L124
