[project]
name = "go-cdr"
version = "0.1.0"
description = "GO Consortium Decision Records: annotation guidelines, MOU commitments and pipeline rubrics, with group sign-off"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "linkml>=1.8",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
terms = ["oaklib>=0.6"]

[project.scripts]
go-cdr = "go_cdr.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/go_cdr"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
